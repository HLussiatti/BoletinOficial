name: Boletín cloud worker

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Solicitud registrada en Turso
        required: true
        type: string

permissions:
  contents: read

jobs:
  run-request:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EPE_CLOUD_JOB_ID: ${{ inputs.job_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application
        run: python -m pip install -e '.[cloud]'
      - name: Execute request
        run: python -m epe_boletin.cloud_worker
